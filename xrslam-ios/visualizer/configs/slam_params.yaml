%YAML:1.0
output:
  q_bo: [ 0, 0, 0, 1 ] # x y z w
  p_bo: [ 0, 0, 0 ] # x y z [m]

feature_tracker:
  min_keypoint_distance: 25.0
  max_keypoint_detection: 300
  max_frames: 100

solver:
  time_limit: 0.1
  iteration_limit: 10

sliding_window:
  size: 5
  tracker_frequent: 3

visual_localization:
  enable: false   # [pw] 默认关闭远程外发
  # [pw] 已移除硬编码内网地址(原为明文 HTTP 外发图像)
  port: 12345

parsac:
  parsac_flag: false
  dynamic_probability: 0.15
  threshold: 1.0
  norm_scale: 1.0
  keyframe_check_size: 1
